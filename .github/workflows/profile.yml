name: Refresh profile visuals

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - profile-config.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify notebook counting and contribution parsing
        run: python -m unittest discover -s tests -v
      - name: Generate visuals from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit changed visuals
        run: |
          git add assets/header-*.svg assets/contributions-*.svg assets/languages-*.svg assets/profile-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile visuals"
          git push origin HEAD:main
